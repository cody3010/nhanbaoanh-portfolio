@"
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: cody-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cody-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vietnam-hpa
  namespace: cody-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cody-vietnam
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cody-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cody-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
"@ | Out-File -Encoding UTF8 hpa.yaml
