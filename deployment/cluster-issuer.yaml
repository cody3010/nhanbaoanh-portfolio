@"
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Server thật của Let's Encrypt
    server: https://acme-v02.api.letsencrypt.org/directory
    email: anh.nb3010@gmail.com
    # Tên Secret chứa khóa riêng tư của tài khoản ACME
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - http01:
        ingress:
          class: azure/application-gateway
"@ | Out-File -Encoding UTF8 cluster-issuer.yaml
